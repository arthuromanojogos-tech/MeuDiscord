<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Meu Discord - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #313338;
            color: #dbdee1;
        }

        body {
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #2b2d31;
            width: 100%;
            max-width: 380px;
            padding: 30px 24px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.35);
        }

        h2 {
            text-align: center;
            margin: 0 0 10px;
            color: white;
        }

        input {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 6px;
            background: #383a40;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            outline: 2px solid #5865f2;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            color: white;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            background: #5865f2;
        }

        button:hover {
            background: #4752c4;
        }

        button:active {
            transform: scale(0.98);
        }

        #registerBtn {
            background: #3ba55c;
        }

        #registerBtn:hover {
            background: #2d7d46;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            min-height: 20px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 25px 20px;
                border-radius: 10px;
            }

            input,
            button {
                font-size: 16px;
            }

        }

    </style>

</head>

<body>

    <div class="card">

        <h2 id="title">
            Entrar no Chat
        </h2>

        <input
            id="user"
            type="text"
            placeholder="Usuário"
            autocomplete="username"
        >

        <input
            id="pass"
            type="password"
            placeholder="Senha"
            autocomplete="current-password"
        >

        <button
            id="loginBtn"
            onclick="auth('login')"
        >
            Entrar
        </button>

        <button
            id="registerBtn"
            onclick="auth('register')"
        >
            Criar Conta
        </button>

        <div id="message"></div>

    </div>

    <script>

        /*
        =====================================================
        SERVIDOR
        =====================================================
        */

        const API_URL =
            'https://meudiscord.onrender.com';


        /*
        =====================================================
        ELEMENTOS
        =====================================================
        */

        const userInput =
            document.getElementById('user');

        const passInput =
            document.getElementById('pass');

        const message =
            document.getElementById('message');

        const loginBtn =
            document.getElementById('loginBtn');

        const registerBtn =
            document.getElementById('registerBtn');


        /*
        =====================================================
        AUTENTICAÇÃO
        =====================================================
        */

        async function auth(type) {

            const username =
                userInput.value.trim();

            const password =
                passInput.value;


            if (!username || !password) {

                showMessage(
                    'Preencha usuário e senha.',
                    true
                );

                return;
            }


            setLoading(true);


            try {

                const res =
                    await fetch(
                        API_URL + '/' + type,
                        {
                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            credentials: 'include',

                            body: JSON.stringify({
                                username,
                                password
                            })
                        }
                    );


                const text =
                    await res.text();


                if (!res.ok) {

                    showMessage(
                        text ||
                        'Erro ao acessar o servidor.',
                        true
                    );

                    setLoading(false);

                    return;
                }


                /*
                =================================================
                CADASTRO
                =================================================
                */

                if (type === 'register') {

                    showMessage(
                        'Conta criada! Entrando...',
                        false
                    );


                    const loginRes =
                        await fetch(
                            API_URL + '/login',
                            {
                                method: 'POST',

                                headers: {
                                    'Content-Type':
                                        'application/json'
                                },

                                credentials: 'include',

                                body: JSON.stringify({
                                    username,
                                    password
                                })
                            }
                        );


                    if (!loginRes.ok) {

                        showMessage(
                            'Conta criada. Faça login.',
                            false
                        );

                        setLoading(false);

                        return;
                    }


                    localStorage.setItem(
                        'chat_username',
                        username
                    );


                    openChat();

                    return;
                }


                /*
                =================================================
                LOGIN
                =================================================
                */

                localStorage.setItem(
                    'chat_username',
                    username
                );


                openChat();

            }

            catch (error) {

                console.error(
                    'Erro de conexão:',
                    error
                );


                showMessage(
                    'Não foi possível conectar ao servidor.',
                    true
                );


                setLoading(false);

            }

        }


        /*
        =====================================================
        ABRIR CHAT
        =====================================================
        */

        function openChat() {

            /*
             * IMPORTANTE:
             *
             * Não usar:
             *
             * ./index.html
             *
             * porque o servidor Render não está
             * disponibilizando essa rota dessa forma.
             *
             * A página principal fica na rota /.
             */

            window.location.replace('/');

        }


        /*
        =====================================================
        LOADING
        =====================================================
        */

        function setLoading(loading) {

            loginBtn.disabled =
                loading;

            registerBtn.disabled =
                loading;


            if (loading) {

                loginBtn.textContent =
                    'Entrando...';

                registerBtn.textContent =
                    'Aguarde...';

            }

            else {

                loginBtn.textContent =
                    'Entrar';

                registerBtn.textContent =
                    'Criar Conta';

            }

        }


        /*
        =====================================================
        MENSAGEM
        =====================================================
        */

        function showMessage(
            text,
            error
        ) {

            message.textContent =
                text;

            message.style.color =
                error
                    ? '#ed4245'
                    : '#3ba55c';

        }


        /*
        =====================================================
        ENTER
        =====================================================
        */

        document.addEventListener(
            'keydown',
            event => {

                if (
                    event.key === 'Enter'
                ) {

                    auth('login');

                }

            }
        );

    </script>

</body>

</html>
