<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Meu Discord</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#313338;
    color:#fff
}
button,input{
    font:inherit
}
button{
    border:0;
    cursor:pointer
}

#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column
}

header{
    height:60px;
    min-height:60px;
    background:#1e1f22;
    display:flex;
    align-items:center;
    padding:8px 12px;
    gap:10px
}

#my-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#5865f2;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-weight:bold
}

#my-avatar img{
    width:100%;
    height:100%;
    object-fit:cover
}

#username{
    font-weight:bold;
    flex:1
}

#status{
    font-size:12px;
    color:#23a559
}

main{
    flex:1;
    min-height:0;
    display:flex
}

#friends{
    width:100%;
    overflow-y:auto;
    background:#2b2d31
}

#friends.hidden{
    display:none
}

.section{
    padding:15px
}

.section h3{
    margin:0 0 12px;
    font-size:15px;
    color:#b5bac1
}

.add{
    display:flex;
    gap:7px
}

.add input{
    min-width:0;
    flex:1;
    padding:11px;
    border:0;
    outline:0;
    border-radius:6px;
    background:#1e1f22;
    color:#fff
}

.add button{
    padding:0 14px;
    border-radius:6px;
    background:#5865f2;
    color:#fff
}

.friend{
    padding:12px;
    display:flex;
    align-items:center;
    gap:10px;
    border-radius:7px;
    margin:4px 8px;
    background:#313338
}

    background:#404249
}

    width:42px;
    height:42px;
    min-width:42px;
    border-radius:50%;
    background:#5865f2;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

}

.avatar img{
    width:100%;
    height:100%;

}

.friend-name{
    flex:1;

    #friends{

</style>
</head>

<body>

<div id="app">

<header>
    <div id="my-avatar">?</div>
    <div id="username">Carregando...</div>
    <div id="status">● online</div>
</header>

<main>

<section id="friends">

    <div class="section">

        <h3>ADICIONAR AMIGO</h3>

        <div class="add">
            <input id="friend-input" placeholder="Nome do usuário">
            <button onclick="addFriend()">+</button>
        </div>

    </div>

    <div class="section">
        <h3>PEDIDOS</h3>
        <div id="pending"></div>
    </div>

    <div class="section">
        <h3>AMIGOS</h3>
        <div id="friend-list">
            <div id="empty">Carregando amigos...</div>
        </div>
    </div>

</section>

<section id="chat">

    <div class="chat-header">
        <button id="back" onclick="closeChat()">‹</button>

        <div id="chat-avatar" class="avatar">?</div>

        <div id="chat-user">Chat</div>
    </div>

    <div id="messages"></div>

    <div id="send-area">
        <input
            id="message-input"
            placeholder="Digite uma mensagem..."
            autocomplete="off"
        >
        <button id="send" onclick="sendMessage()">➤</button>
    </div>

</section>

</main>
</div>

<div id="toast" class="toast"></div>

<script>

/* =====================================================
   SERVIDOR
===================================================== */

const API_URL = 'https://meudiscord.onrender.com';

const socket = io(API_URL,{
    transports:['websocket','polling'],
    withCredentials:true
});


/* =====================================================
   ESTADO
===================================================== */

let currentUser = '';
let currentFriend = '';
let currentRoom = '';

const $ = id => document.getElementById(id);


/* =====================================================
   MENSAGEM
===================================================== */

function toast(text){

    const el = $('toast');

    el.textContent = text;
    el.style.display = 'block';

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(()=>{
        el.style.display = 'none';
    },2500);
}


/* =====================================================
   AVATAR
===================================================== */

function avatarHTML(avatar,username){

    if(avatar){
        return `<img src="${avatar}" alt="">`;
    }

    return (username || '?')
        .charAt(0)
        .toUpperCase();
}


/* =====================================================
   USUÁRIO
===================================================== */

async function loadMe(){

    try{

        const res = await fetch(
            `${API_URL}/me`,
            {
                credentials:'include'
            }
        );

        if(!res.ok){
            throw new Error('Não autenticado');
        }

        const data = await res.json();

        if(!data.loggedIn){
            throw new Error('Não autenticado');
        }

        currentUser = data.username;

        $('username').textContent = currentUser;

        socket.emit(
            'register user',
            currentUser
        );

        await loadProfile();
        await loadFriends();

    }catch(error){

        console.error(error);

        $('username').textContent =
            'Não conectado';

        toast(
            'Não foi possível conectar ao servidor.'
        );
    }
}


/* =====================================================
   PERFIL
===================================================== */

async function loadProfile(){

    try{

        const res = await fetch(
            `${API_URL}/user/${encodeURIComponent(currentUser)}`,
            {
                credentials:'include'
            }
        );

        if(!res.ok)return;

        const user = await res.json();

        $('my-avatar').innerHTML =
            avatarHTML(
                user.avatar,
                user.username
            );

    }catch(error){

        console.error(error);
    }
}


/* =====================================================
   AMIGOS
===================================================== */

async function loadFriends(){

    if(!currentUser)return;

    try{

        const res = await fetch(
            `${API_URL}/friends/${encodeURIComponent(currentUser)}`,
            {
                credentials:'include'
            }
        );

        if(!res.ok){
            throw new Error('Erro ao carregar amigos');
        }

        const data = await res.json();

        renderFriends(data.friends || []);
        renderPending(data.pendingRequests || []);

    }catch(error){

        console.error(error);

        $('friend-list').innerHTML =
            '<div id="empty">Erro ao carregar amigos.</div>';
    }
}


function renderFriends(friends){

    const list = $('friend-list');

    list.innerHTML = '';

    if(!friends.length){

        list.innerHTML =
            '<div id="empty">Você ainda não possui amigos.</div>';

        return;
    }

    friends.forEach(friend=>{

        const div = document.createElement('div');

        div.className = 'friend';

        div.innerHTML = `
            <div class="avatar">
                ${avatarHTML(friend.avatar,friend.username)}
            </div>

            <div class="friend-name">
                ${escapeHTML(friend.username)}
            </div>

            <button>
                Abrir
            </button>
        `;

        div.querySelector('button').onclick =
            () => openChat(friend);

        list.appendChild(div);

    });
}


function renderPending(list){

    const container = $('pending');

    container.innerHTML = '';

    if(!list.length){

        container.innerHTML =
            '<div style="color:#777">Nenhum pedido.</div>';

        return;
    }

    list.forEach(friend=>{

        const div = document.createElement('div');

        div.className =
            'friend pending';

        div.innerHTML = `
            <div class="avatar">
                ${avatarHTML(friend.avatar,friend.username)}
            </div>

            <div class="friend-name">
                ${escapeHTML(friend.username)}
            </div>

            <button>Aceitar</button>
        `;

        div.querySelector('button').onclick =
            () => acceptFriend(friend.username);

        container.appendChild(div);

    });
}


/* =====================================================
   ADICIONAR AMIGO
===================================================== */

async function addFriend(){

    const input = $('friend-input');

    const friendName =
        input.value.trim();

    if(!friendName){
        toast('Digite o nome do usuário.');
        return;
    }

    try{

        const res = await fetch(
            `${API_URL}/add-friend`,
            {
                method:'POST',
                credentials:'include',
                headers:{
                    'Content-Type':
                        'application/json'
                },
                body:JSON.stringify({
                    friendName
                })
            }
        );

        const text = await res.text();

        toast(text);

        if(res.ok){

            input.value = '';

            socket.emit(
                'notify update',
                friendName
            );

            await loadFriends();
        }

    }catch(error){

        console.error(error);

        toast('Erro de conexão.');
    }
}


/* =====================================================
   ACEITAR
===================================================== */

async function acceptFriend(friendName){

    try{

        const res = await fetch(
            `${API_URL}/accept-friend`,
            {
                method:'POST',
                credentials:'include',
                headers:{
                    'Content-Type':
                        'application/json'
                },
                body:JSON.stringify({
                    friendName
                })
            }
        );

        toast(await res.text());

        if(res.ok){

            socket.emit(
                'notify update',
                friendName
            );

            await loadFriends();
        }

    }catch(error){

        console.error(error);

        toast('Erro de conexão.');
    }
}


/* =====================================================
   CHAT
===================================================== */

async function openChat(friend){

    currentFriend = friend.username;

    currentRoom =
        [currentUser,currentFriend]
        .sort()
        .join('_');

    $('friends').classList.add('hidden');
    $('chat').classList.add('show');

    $('chat-user').textContent =
        currentFriend;

    $('chat-avatar').innerHTML =
        avatarHTML(
            friend.avatar,
            friend.username
        );

    $('messages').innerHTML = '';

    socket.emit(
        'join room',
        currentRoom
    );
}


function closeChat(){

    currentFriend = '';
    currentRoom = '';

    $('chat').classList.remove('show');
    $('friends').classList.remove('hidden');

    $('messages').innerHTML = '';
}


/* =====================================================
   MENSAGENS
===================================================== */

function sendMessage(){

    const input =
        $('message-input');

    const message =
        input.value.trim();

    if(!message || !currentFriend){
        return;
    }

    socket.emit(
        'private message',
        {
            sender:currentUser,
            receiver:currentFriend,
            message,
            room:currentRoom
        }
    );

    input.value = '';
    input.focus();
}


$('message-input').addEventListener(
    'keydown',
    event=>{

        if(event.key === 'Enter'){
            event.preventDefault();
            sendMessage();
        }

    }
);


/* =====================================================
   SOCKET - HISTÓRICO
===================================================== */

socket.on(
    'load private history',
    messages=>{

        $('messages').innerHTML = '';

        messages.forEach(
            addMessage
        );

        scrollMessages();
    }
);


/* =====================================================
   SOCKET - NOVA MENSAGEM
===================================================== */

socket.on(
    'private message',
    data=>{

        if(
            data.room === currentRoom
        ){

            addMessage(data);

            scrollMessages();

        }else{

            toast(
                `Nova mensagem de ${data.sender}`
            );
        }

    }
);


/* =====================================================
   SOCKET - ATUALIZAR AMIGOS
===================================================== */

socket.on(
    'refresh friends',
    ()=>{
        loadFriends();
    }
);


/* =====================================================
   ADICIONAR MENSAGEM
===================================================== */

function addMessage(data){

    const div =
        document.createElement('div');

    div.className = 'message';

    div.innerHTML = `
        <div class="avatar">
            ${avatarHTML(
                data.avatar,
                data.sender
            )}
        </div>

        <div class="message-body">

            <div class="message-user">
                ${escapeHTML(data.sender)}
            </div>

            <div class="message-text">
                ${escapeHTML(data.message)}
            </div>

        </div>
    `;

    $('messages').appendChild(div);
}


function scrollMessages(){

    const box = $('messages');

    box.scrollTop =
        box.scrollHeight;
}


/* =====================================================
   SEGURANÇA
===================================================== */

function escapeHTML(text){

    return String(text || '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}


/* =====================================================
   SOCKET STATUS
===================================================== */

socket.on('connect',()=>{

    $('status').textContent =
        '● conectado';

    $('status').style.color =
        '#23a559';

    if(currentUser){

        socket.emit(
            'register user',
            currentUser
        );
    }

});


socket.on('disconnect',()=>{

    $('status').textContent =
        '● desconectado';

    $('status').style.color =
        '#ed4245';

});


socket.on('connect_error',error=>{

    console.error(
        'Socket error:',
        error
    );

    $('status').textContent =
        '● erro';

    $('status').style.color =
        '#ed4245';
});


/* =====================================================
   INICIAR
===================================================== */

loadMe();

</script>

</body>
</html>
