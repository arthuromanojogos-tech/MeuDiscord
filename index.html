<!DOCTYPE html>
<html lang="pt-BR">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Discord</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #313338;
    color: #dbdee1;
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
}

/* =========================
   SIDEBAR
========================= */

    width: 280px;

    flex-direction: column;

}

}

    display: flex;

}

.avatar-img {

.avatar-placeholder {

}

.user-profile-info span {
    overflow: hidden;

}

.user-actions {
    display: flex;

}

.profile-btn,
.logout-btn {

.profile-btn {

}

.profile-btn:hover {

}

.logout-btn {
    background: #ed4245;
}

.logout-btn:hover {

}

.friends-container {
    flex: 1;

.section-title {

}

    background: #404249;

}

    display: flex;
    align-items: center;
    gap: 12px;

}

.friend-name {
    overflow: hidden;
    text-overflow: ellipsis;

    font-size: 16px;
}

    border: none;

.call-btn {

}

.hangup-btn {

}

.screen-btn {

}

/* =========================
   CALL BANNER
========================= */

.call-status-banner {

.call-dot {

@keyframes pulse {

}

/* =========================
   TRANSMISSÃO
========================= */

#screen-share-container {

#screen-quality {

/* =========================
   MODAIS
========================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    display: none;
    align-items: center;
    justify-content: center;

.call-modal {

.call-buttons {

.call-buttons button {
    flex: 1;

.accept-call {
    background: #248046;
}

.reject-call,

}

.calling-spinner {

}

@keyframes spin {

.toast {

    background: #111214;
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    display: none;
    z-index: 10000;
}
</style>

<script>

/* =====================================================
   USUÁRIO
===================================================== */

const currentUser =
    localStorage.getItem('chat_username');

if (!currentUser) {
    window.location.href = '/login.html';
}

document.getElementById(
    'username-display'
).innerText = currentUser;


/* =====================================================
   SOCKET
===================================================== */

const socket = io();

socket.emit(
    'register user',
    currentUser
);


/* =====================================================
   ESTADO
===================================================== */

let currentChatFriend = null;
let currentRoom = null;

const unreadCounts = {};

let localStream = null;
let screenStream = null;
let peerConnection = null;

let isInCall = false;
let isCalling = false;
let isIncomingPending = false;
let isSharingScreen = false;

let pendingIncomingOffer = null;

let videoSender = null;
let screenAudioSender = null;

let pendingIceCandidates = [];

let isMakingOffer = false;


/* =====================================================
   QUALIDADES
===================================================== */

const SCREEN_QUALITIES = {

    "720": {
        width: 1280,
        height: 720,
        bitrate: 2500000
    },

    "1080": {
        width: 1920,
        height: 1080,
        bitrate: 6000000
    },

    "1440": {
        width: 2560,
        height: 1440,
        bitrate: 12000000
    }

};

function getSelectedScreenQuality() {

    const select =
        document.getElementById(
            'screen-quality'
        );

    return SCREEN_QUALITIES[
        select.value
    ] || SCREEN_QUALITIES["1080"];

}


/* =====================================================
   WEBRTC
===================================================== */

const rtcServers = {

    iceServers: [

        {
            urls:
                'stun:stun.l.google.com:19302'
        },

        {
            urls:
                'stun:stun1.l.google.com:19302'
        }

    ]

};


/* =====================================================
   TOAST
===================================================== */

function showToast(text) {

    const toast =
        document.getElementById('toast');

    toast.innerText =
        text;

    toast.style.display =
        'block';

    clearTimeout(
        showToast.timer
    );

    showToast.timer =
        setTimeout(
            () => {

                toast.style.display =
                    'none';

            },
            3000
        );

}


/* =====================================================
   AVATAR
===================================================== */

function createAvatarHTML(
    avatarData,
    username,
    isLarge = false
) {

    if (
        avatarData &&
        avatarData.trim() !== ''
    ) {

        return `
            <img
                ${
                    isLarge
                        ? 'style="width:90px;height:90px;border-radius:50%;object-fit:cover;"'
                        : 'class="avatar-img"'
                }
                src="${avatarData}"
                alt="Avatar"
            >
        `;

    }

    const initial =
        username
            ? username.charAt(0).toUpperCase()
            : '?';

    return `
        <div
            ${
                isLarge
                    ? 'style="width:90px;height:90px;border-radius:50%;background:#5865f2;color:white;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:36px;margin:auto;"'
                    : 'class="avatar-placeholder"'
            }
        >
            ${initial}
        </div>
    `;

}


/* =====================================================
   PERFIL
===================================================== */

async function loadMyProfile() {

    try {

        const res =
            await fetch(
                `/user/${encodeURIComponent(currentUser)}`
            );

        const user =
            res.ok
                ? await res.json()
                : {
                    avatar: '',
                    username: currentUser
                };

        document.getElementById(
            'my-avatar-container'
        ).innerHTML =
            createAvatarHTML(
                user.avatar,
                user.username
            );

    } catch {

        document.getElementById(
            'my-avatar-container'
        ).innerHTML =
            createAvatarHTML(
                '',
                currentUser
            );

    }

}


function uploadAvatar(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    const reader =
        new FileReader();

    reader.onload =
        async function(e) {

            const base64Image =
                e.target.result;

            const res =
                await fetch(
                    '/update-avatar',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({

                            username:
                                currentUser,

                            avatar:
                                base64Image

                        })
                    }
                );

            if (res.ok) {

                loadMyProfile();
                loadFriends();

                showToast(
                    'Foto de perfil alterada!'
                );

            } else {

                alert(
                    'Erro ao alterar foto.'
                );

            }

        };

    reader.readAsDataURL(file);

}


/* =====================================================
   LOGOUT
===================================================== */

function logout() {

    if (
        isInCall ||
        isCalling
    ) {

        endCall();

    }

    localStorage.removeItem(
        'chat_username'
    );

    window.location.href =
        '/login.html';

}


/* =====================================================
   AMIGOS
===================================================== */

async function loadFriends() {

    try {

        const res =
            await fetch(
                `/friends/${encodeURIComponent(currentUser)}`
            );

        const data =
            await res.json();

        const container =
            document.getElementById(
                'friends-container'
            );

        container.innerHTML = '';


        if (
            data.pendingRequests &&
            data.pendingRequests.length > 0
        ) {

            const title =
                document.createElement(
                    'div'
                );

            title.className =
                'section-title';

            title.innerText =
                'Pedidos Pendentes';

            container.appendChild(
                title
            );


            data.pendingRequests.forEach(
                user => {

                    const div =
                        document.createElement(
                            'div'
                        );

                    div.className =
                        'friend-item';

                    div.innerHTML = `

                        <div class="friend-info">

                            ${createAvatarHTML(
                                user.avatar,
                                user.username
                            )}

                            <span class="friend-name">
                                ${user.username}
                            </span>

                        </div>

                        <div class="action-btns">

                            <button
                                class="btn-accept"
                                onclick="event.stopPropagation();acceptFriend('${user.username}')"
                            >
                                Aceitar
                            </button>

                            <button
                                class="btn-remove"
                                onclick="event.stopPropagation();removeFriend('${user.username}')"
                            >
                                Recusar
                            </button>

                        </div>
                    `;

                    container.appendChild(
                        div
                    );

                }
            );

        }


        const title =
            document.createElement(
                'div'
            );

        title.className =
            'section-title';

        title.innerText =
            'Mensagens Diretas';

        container.appendChild(
            title
        );


        if (
            !data.friends ||
            data.friends.length === 0
        ) {

            const noFriends =
                document.createElement(
                    'div'
                );

            noFriends.className =
                'no-friends';

            noFriends.innerText =
                'Nenhum amigo adicionado.';

            container.appendChild(
                noFriends
            );

            return;

        }


        data.friends.forEach(
            friend => {

                const div =
                    document.createElement(
                        'div'
                    );

                div.className =
                    'friend-item';


                if (
                    friend.username ===
                    currentChatFriend
                ) {

                    div.classList.add(
                        'active'
                    );

                }


                const unread =
                    unreadCounts[
                        friend.username
                    ] || 0;


                div.innerHTML = `

                    <div class="friend-info">

                        ${createAvatarHTML(
                            friend.avatar,
                            friend.username
                        )}

                        <span class="friend-name">
                            ${friend.username}
                        </span>

                    </div>

                    <div
                        class="unread-badge"
                        style="${
                            unread
                                ? 'display:inline-block'
                                : 'display:none'
                        }"
                    >
                        ${unread}
                    </div>

                `;


                div.onclick =
                    () => {

                        openChat(
                            friend.username,
                            friend.avatar || ''
                        );

                    };


                container.appendChild(
                    div
                );

            }
        );

    } catch (error) {

        console.error(
            'Erro ao carregar amigos:',
            error
        );

    }

}

/* =====================================================
   PEER CONNECTION
===================================================== */

async function setupPeerConnection() {

    if (peerConnection) {

        try {
            peerConnection.close();
        } catch {}

    }


    pendingIceCandidates = [];


    peerConnection =
        new RTCPeerConnection(
            rtcServers
        );


    /*
     * Microfone.
     */

    if (localStream) {

        localStream
            .getAudioTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );

    }


    /*
     * Recebe áudio/vídeo remoto.
     */

    peerConnection.ontrack =
        async event => {

            const stream =
                event.streams &&
                event.streams[0];


            if (!stream) {
                return;
            }


            if (
                event.track.kind ===
                'video'
            ) {

                const video =
                    document.getElementById(
                        'remote-screen'
                    );


                video.srcObject =
                    stream;


                document.getElementById(
                    'screen-share-container'
                ).style.display =
                    'block';


                try {

                    await video.play();

                } catch (error) {

                    console.warn(
                        'Autoplay do vídeo bloqueado:',
                        error
                    );

                }


                event.track.onended =
                    () => {

                        if (
                            video.srcObject ===
                            stream
                        ) {

                            video.srcObject =
                                null;

                        }


                        hideRemoteScreen();

                    };

            }


            if (
                event.track.kind ===
                'audio'
            ) {

                const audio =
                    document.getElementById(
                        'remote-audio'
                    );


                /*
                 * Mantém o áudio da chamada
                 * separado do vídeo.
                 */

                if (
                    audio.srcObject !==
                    stream
                ) {

                    audio.srcObject =
                        stream;

                }


                try {

                    await audio.play();

                } catch {}

            }

        };


    /*
     * ICE.
     */

    peerConnection.onicecandidate =
        event => {

            if (
                event.candidate &&
                currentRoom
            ) {

                socket.emit(
                    'ice-candidate',
                    {

                        candidate:
                            event.candidate,

                        room:
                            currentRoom,

                        sender:
                            currentUser

                    }
                );

            }

        };


    peerConnection.onconnectionstatechange =
        () => {

            if (!peerConnection) {
                return;
            }


            const state =
                peerConnection.connectionState;


            console.log(
                'WebRTC:',
                state
            );


            if (
                state === 'failed'
            ) {

                showToast(
                    'A conexão WebRTC falhou.'
                );

            }


            if (
                state === 'disconnected'
            ) {

                console.warn(
                    'WebRTC desconectado.'
                );

            }

        };


    peerConnection.oniceconnectionstatechange =
        () => {

            if (!peerConnection) {
                return;
            }

            console.log(
                'ICE:',
                peerConnection.iceConnectionState
            );

        };


    videoSender = null;
    screenAudioSender = null;

}


/* =====================================================
   NEGOCIAÇÃO
===================================================== */

async function createAndSendOffer(
    eventName = 'renegotiation-offer'
) {

    if (
        !peerConnection ||
        !currentRoom ||
        !isInCall
    ) {

        return;

    }


    if (isMakingOffer) {
        return;
    }


    try {

        isMakingOffer =
            true;


        const offer =
            await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
            offer
        );


        socket.emit(
            eventName,
            {

                offer:
                    peerConnection.localDescription,

                room:
                    currentRoom,

                sender:
                    currentUser

            }
        );

    } catch (error) {

        console.error(
            'Erro criando oferta:',
            error
        );

    } finally {

        isMakingOffer =
            false;

    }

}


async function renegotiate() {

    await createAndSendOffer(
        'renegotiation-offer'
    );

}


/* =====================================================
   INICIAR CHAMADA
===================================================== */

async function startCall() {

    if (
        !currentRoom ||
        !currentChatFriend ||
        isInCall ||
        isCalling
    ) {

        return;

    }


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            'Seu navegador/app não disponibiliza acesso ao microfone.'
        );

        return;

    }


    try {

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: true,

                    video: false

                });


        await setupPeerConnection();


        const offer =
            await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
            offer
        );


        isCalling =
            true;


        showOutgoingCall();


        socket.emit(
            'call-offer',
            {

                offer:
                    peerConnection.localDescription,

                room:
                    currentRoom,

                sender:
                    currentUser

            }
        );


    } catch (error) {

        console.error(
            'Erro ao iniciar chamada:',
            error
        );


        cleanupCall(false);


        alert(
            'Não foi possível acessar o seu microfone.\n\n' +
            'Erro: ' +
            error.message
        );

    }

}

/* =====================================================
   ATENDER
===================================================== */

async function acceptIncomingCall() {

    const data =
        pendingIncomingOffer;


    if (!data) {
        return;
    }


    hideIncomingCall();

    isIncomingPending =
        false;


    /*
     * Se a pessoa estiver em outro chat,
     * muda automaticamente para quem ligou.
     */

    const incomingFriend =
        data.sender;


    if (
        incomingFriend &&
        incomingFriend !== currentChatFriend
    ) {

        try {

            const res =
                await fetch(
                    `/user/${encodeURIComponent(incomingFriend)}`
                );

            const user =
                res.ok
                    ? await res.json()
                    : {
                        avatar: ''
                    };


            openChat(
                incomingFriend,
                user.avatar || ''
            );

        } catch {

            openChat(
                incomingFriend,
                ''
            );

        }

    }


    /*
     * Garante que o room usado é o da chamada.
     */

    currentRoom =
        data.room;


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        showToast(
            'Seu navegador/app não permite acesso ao microfone.'
        );

        socket.emit(
            'call-rejected',
            {

                room:
                    data.room,

                sender:
                    currentUser

            }
        );

        pendingIncomingOffer =
            null;

        return;

    }


    try {

        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio: true,

                    video: false

                });


        await setupPeerConnection();


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    data.offer
                )
            );


        await flushPendingIce();


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        socket.emit(
            'call-answer',
            {

                answer:
                    peerConnection.localDescription,

                room:
                    data.room,

                sender:
                    currentUser

            }
        );


        socket.emit(
            'call-accepted',
            {

                room:
                    data.room,

                sender:
                    currentUser

            }
        );


        setInCallUI(
            true
        );


    } catch (error) {

        console.error(
            'Erro ao atender:',
            error
        );


        cleanupCall(false);


        socket.emit(
            'call-rejected',
            {

                room:
                    data.room,

                sender:
                    currentUser

            }
        );

    }


    pendingIncomingOffer =
        null;

}


/* =====================================================
   RECUSAR
===================================================== */

function rejectIncomingCall() {

    const data =
        pendingIncomingOffer;


    if (!data) {
        return;
    }


    hideIncomingCall();


    isIncomingPending =
        false;


    pendingIncomingOffer =
        null;


    socket.emit(
        'call-rejected',
        {

            room:
                data.room,

            sender:
                currentUser

        }
    );


    showToast(
        'Chamada recusada.'
    );

}

function cancelOutgoingCall() {

    if (!isCalling) {
        return;
    }


    const room =
        currentRoom;


    isCalling =

            room:

            sender:

        }

/* =====================================================
   VERIFICAR GET DISPLAY MEDIA
===================================================== */

function canShareScreen() {

    return !!(
        navigator.mediaDevices &&
        typeof navigator.mediaDevices.getDisplayMedia ===
            'function'
    );

}


/* =====================================================
   COMPARTILHAR TELA
===================================================== */

async function toggleScreenShare() {

    if (
        !peerConnection ||
        !isInCall
    ) {

        showToast(
            'Você precisa estar em uma chamada.'
        );

        return;

    }


    if (isSharingScreen) {

        await stopScreenShare();

        return;

    }


    /*
     * Essa verificação é importante principalmente
     * para o aplicativo.
     */

    if (!canShareScreen()) {

        alert(
            'Este aplicativo/navegador não disponibiliza o compartilhamento de tela.\n\n' +
            'Se estiver usando um app baseado em WebView, ele precisa permitir a API getDisplayMedia.'
        );

        return;

    }


    const button =
        document.getElementById(
            'screen-action-btn'
        );


    try {

        const quality =
            getSelectedScreenQuality();


        /*
         * IMPORTANTE:
         *
         * A qualidade é escolhida por QUEM TRANSMITE.
         *
         * 720p  = 1280x720
         * 1080p = 1920x1080
         * 2K    = 2560x1440
         *
         * O navegador pode entregar uma resolução menor
         * caso a tela/captura não suporte a resolução pedida.
         */

        screenStream =
            await navigator.mediaDevices
                .getDisplayMedia({

                    video: {

                        width: {
                            ideal:
                                quality.width,

                            max:
                                quality.width
                        },

                        height: {

                            ideal:
                                quality.height,

                            max:
                                quality.height
                        },

                        frameRate: {
                            ideal: 30,
                            max: 60
                        }

                    },

                    /*
                     * Áudio da tela é opcional.
                     * Alguns navegadores não permitem áudio
                     * em determinadas fontes.
                     */

                    audio: true

                });


        const videoTrack =
            screenStream
                .getVideoTracks()[0];


        if (!videoTrack) {

            throw new Error(
                'Nenhuma tela foi selecionada.'
            );

        }


        /*
         * Aplique a qualidade solicitada.
         */

        try {

            await videoTrack.applyConstraints({

                width: {
                    ideal:
                        quality.width,

                    max:
                        quality.width
                },

                height: {
                    ideal:
                        quality.height,

                    max:
                        quality.height
                },

                frameRate: {
                    ideal: 30,
                    max: 60
                }

            });

        } catch (error) {

            console.warn(
                'Não foi possível aplicar todas as constraints:',
                error
            );

        }


        /*
         * Procura o sender de vídeo.
         */

        videoSender =
            peerConnection
                .getSenders()
                .find(
                    sender =>
                        sender.track &&
                        sender.track.kind ===
                            'video'
                );


        /*
         * Cria o sender caso ainda não exista.
         */

        if (!videoSender) {

            videoSender =
                peerConnection.addTrack(
                    videoTrack,
                    screenStream
                );

        } else {

            await videoSender.replaceTrack(
                videoTrack
            );

        }


        /*
         * Áudio da tela.
         */

        const screenAudioTrack =
            screenStream
                .getAudioTracks()[0];


        if (screenAudioTrack) {

            screenAudioSender =
                peerConnection
                    .getSenders()
                    .find(
                        sender =>
                            sender.track &&
                            sender.track.kind ===
                                'audio' &&
                            sender.track !==
                                localStream
                                    ?.getAudioTracks()[0]
                    );


            if (!screenAudioSender) {

                screenAudioSender =
                    peerConnection.addTrack(
                        screenAudioTrack,
                        screenStream
                    );

            } else {

                await screenAudioSender
                    .replaceTrack(
                        screenAudioTrack
                    );

            }

        }


        /*
         * Bitrate.
         */

        try {

            const parameters =
                videoSender.getParameters();


            if (!parameters.encodings) {

                parameters.encodings = [
                    {}
                ];

            }


            parameters.encodings[0].maxBitrate =
                quality.bitrate;


            parameters.encodings[0].maxFramerate =
                30;


            await videoSender.setParameters(
                parameters
            );

        } catch (error) {

            console.warn(
                'Não foi possível configurar bitrate:',
                error
            );

        }


        isSharingScreen =
            true;


        button.innerText =
            `🛑 Parar transmissão (${quality.height}p)`;


        button.style.background =
            '#ed4245';


        showToast(
            `Transmitindo em ${quality.height}p`
        );


        /*
         * Renegocia com o outro usuário.
         */

        await renegotiate();


        /*
         * Se o navegador mandar o evento "ended",
         * significa que o usuário clicou em
         * "Parar compartilhamento".
         */

        videoTrack.onended =
            async () => {

                if (isSharingScreen) {

                    await stopScreenShare();

                }

            };


    } catch (error) {

        console.error(
            'Erro ao compartilhar tela:',
            error
        );


        /*
         * Cancelar no seletor de tela
         * não é erro real.
         */

        if (
            error.name ===
            'NotAllowedError'
        ) {

            showToast(
                'Compartilhamento de tela cancelado.'
            );

        } else {

            alert(
                'Não foi possível compartilhar a tela.\n\n' +
                'Erro: ' +
                error.message
            );

        }


        if (screenStream) {

            screenStream
                .getTracks()
                .forEach(
                    track => {

                        try {
                            track.stop();
                        } catch {}

                    }
                );

            screenStream =
                null;

        }


        isSharingScreen =
            false;


        videoSender =
            null;

        screenAudioSender =
            null;


        button.innerText =
            '🖥️ Compartilhar Tela';


        button.style.background =
            '#5865f2';

    }

}


/* =====================================================
   PARAR TRANSMISSÃO
===================================================== */

async function stopScreenShare() {

    if (!peerConnection) {

        isSharingScreen =
            false;

        return;

    }


    /*
     * Guarda o sender antes de remover.
     */

    const senders =
        peerConnection.getSenders();


    /*
     * Remove o vídeo da tela.
     */

    if (videoSender) {

        try {

            await videoSender.replaceTrack(
                null
            );

        } catch (error) {

            console.warn(
                error
            );

        }

    }


    /*
     * Remove o áudio da tela.
     */

    if (screenAudioSender) {

        try {

            await screenAudioSender.replaceTrack(
                null
            );

        } catch (error) {

            console.warn(
                error
            );

        }

    }


    /*
     * Para todas as tracks.
     */

    if (screenStream) {

        screenStream
            .getTracks()
            .forEach(
                track => {

                    try {

                        track.onended =
                            null;

                        track.stop();

                    } catch {}

                }
            );

        screenStream =
            null;

    }


    videoSender =
        null;

    screenAudioSender =
        null;

    isSharingScreen =
        false;


    const button =
        document.getElementById(
            'screen-action-btn'
        );


    button.innerText =
        '🖥️ Compartilhar Tela';


    button.style.background =
        '#5865f2';


    /*
     * Remove a imagem local/remota da interface.
     */

    hideRemoteScreen();


    /*
     * Renegociação avisa ao outro lado que
     * não existe mais vídeo.
     */

    if (isInCall) {

        await renegotiate();

    }

}


/* =====================================================
   ESCONDER TELA REMOTA
===================================================== */

function hideRemoteScreen() {

    const container =
        document.getElementById(
            'screen-share-container'
        );

    const video =
        document.getElementById(
            'remote-screen'
        );


    /*
     * Remove o srcObject.
     * Isso evita deixar a última imagem congelada.
     */

    try {

        video.pause();

    } catch {}


    video.srcObject =
        null;


    container.style.display =
        'none';

}


/* =====================================================
   LIMPAR CALL
===================================================== */

function cleanupCall(
    notifyRemote = false
) {

    if (screenStream) {

        screenStream
            .getTracks()
            .forEach(
                track => {

                    try {

                        track.onended =
                            null;

                        track.stop();

                    } catch {}

                }
            );

        screenStream =
            null;

    }


    if (localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    try {
                        track.stop();
                    } catch {}

                }
            );

        localStream =
            null;

    }


    if (peerConnection) {

        try {
            peerConnection.ontrack = null;
            peerConnection.onicecandidate = null;
            peerConnection.close();
        } catch {}

        peerConnection =
            null;

    }


    videoSender =
        null;

    screenAudioSender =
        null;


    pendingIceCandidates =
        [];


    isSharingScreen =
        false;

    isMakingOffer =
        false;


    /*
     * IMPORTANTE:
     * limpa completamente o vídeo remoto.
     * Assim não fica a última imagem congelada.
     */

    hideRemoteScreen();


    document.getElementById(
        'remote-audio'
    ).srcObject =
        null;


    const screenButton =
        document.getElementById(
            'screen-action-btn'
        );


    if (screenButton) {

        screenButton.innerText =
            '🖥️ Compartilhar Tela';

        screenButton.style.background =
            '#5865f2';

    }


    if (
        notifyRemote &&
        currentRoom
    ) {

        socket.emit(
            'hang-up',
            {
                room:
                    currentRoom
            }
        );

    }

}


/* =====================================================
   DESLIGAR CALL
===================================================== */

function endCall() {

    const room =
        currentRoom;


    if (isCalling) {

        isCalling =
            false;


        hideOutgoingCall();


        cleanupCall(false);


        socket.emit(
            'call-cancelled',
            {

                room:
                    room,

                sender:
                    currentUser

            }
        );


        setInCallUI(
            false
        );


        return;

    }


    if (!isInCall) {

        cleanupCall(false);

        return;

    }


    cleanupCall(false);


    socket.emit(
        'hang-up',
        {

            room:
                room

        }
    );


    setInCallUI(
        false
    );

}


/* =====================================================
   CALL OFFER
===================================================== */

socket.on(
    'call-offer',
    data => {

        if (
            !data ||
            !data.room
        ) {

            return;

        }


        if (
            isInCall ||
            isCalling ||
            isIncomingPending
        ) {

            return;

        }


        showIncomingCall(
            data
        );

    }
);


/* =====================================================
   CALL ANSWER
===================================================== */

socket.on(
    'call-answer',
    async data => {

        if (
            !peerConnection ||
            !data ||
            data.room !== currentRoom
        ) {

            return;

        }


        try {

            await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        data.answer
                    )
                );


            await flushPendingIce();


            isCalling =
                false;


            hideOutgoingCall();


            setInCallUI(
                true
            );


        } catch (error) {

            console.error(
                'Erro ao receber answer:',
                error
            );

        }

    }
);


/* =====================================================
   CALL ACCEPTED
===================================================== */

socket.on(
    'call-accepted',
    data => {

        if (
            data &&
            data.room === currentRoom &&
            isCalling
        ) {

            showToast(
                'Chamada aceita!'
            );

        }

    }
);


/* =====================================================
   CALL REJECTED
===================================================== */

socket.on(
    'call-rejected',
    data => {

        if (
            !data ||
            data.room !== currentRoom
        ) {

            return;

        }


        isCalling =
            false;


        hideOutgoingCall();


        cleanupCall(false);


        setInCallUI(
            false
        );


        showToast(
            `${data.sender || 'O usuário'} recusou a chamada.`
        );

    }
);


/* =====================================================
   CALL CANCELLED
===================================================== */

socket.on(
    'call-cancelled',
    data => {

        if (
            !data ||
            data.room !== currentRoom
        ) {

            return;

        }


        if (isIncomingPending) {

            hideIncomingCall();

            isIncomingPending =
                false;

            pendingIncomingOffer =
                null;

            showToast(
                'A chamada foi cancelada.'
            );

        }


        if (isInCall) {

            cleanupCall(false);

            setInCallUI(
                false
            );

            showToast(
                'A chamada foi encerrada.'
            );

        }

    }
);


/* =====================================================
   RENEGOCIAÇÃO - RECEBER OFFER
===================================================== */

socket.on(
    'renegotiation-offer',
    async data => {

        if (
            !peerConnection ||
            !isInCall ||
            !data ||
            data.room !== currentRoom
        ) {

            return;

        }


        try {

            await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        data.offer
                    )
                );


            await flushPendingIce();


            const answer =
                await peerConnection
                    .createAnswer();


            await peerConnection
                .setLocalDescription(
                    answer
                );


            socket.emit(
                'renegotiation-answer',
                {

                    answer:
                        peerConnection.localDescription,

                    room:
                        currentRoom,

                    sender:
                        currentUser

                }
            );

        } catch (error) {

            console.error(
                'Erro na renegociação:',
                error
            );

        }

    }
);


/* =====================================================
   RENEGOTIATION ANSWER
===================================================== */

socket.on(
    'renegotiation-answer',
    async data => {

        if (
            !peerConnection ||
            !data ||
            data.room !== currentRoom
        ) {

            return;

        }


        try {

            await peerConnection
                .setRemoteDescription(
                    new RTCSessionDescription(
                        data.answer
                    )
                );


            await flushPendingIce();


        } catch (error) {

            console.error(
                'Erro na resposta da renegociação:',
                error
            );

        }

    }
);


/* =====================================================
   ICE
===================================================== */

socket.on(
    'ice-candidate',
    async data => {

        if (
            !data ||
            data.room !== currentRoom ||
            !peerConnection
        ) {

            return;

        }


        try {

            if (
                peerConnection
                    .remoteDescription
            ) {

                await peerConnection
                    .addIceCandidate(
                        new RTCIceCandidate(
                            data.candidate
                        )
                    );

            } else {

                pendingIceCandidates.push(
                    data.candidate
                );

            }

        } catch (error) {

            console.error(
                'Erro ICE:',
                error
            );

        }

    }
);


/* =====================================================
   ICE PENDENTE
===================================================== */

async function flushPendingIce() {

    if (
        !peerConnection ||
        !peerConnection.remoteDescription
    ) {

        return;

    }


    const candidates =
        [
            ...pendingIceCandidates
        ];


    pendingIceCandidates =
        [];


    for (
        const candidate
        of candidates
    ) {

        try {

            await peerConnection
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        } catch (error) {

            console.error(
                'Erro adicionando ICE pendente:',
                error
            );

        }

    }

}


/* =====================================================
   OUTRO USUÁRIO DESLIGOU
===================================================== */

socket.on(
    'hang-up',
    () => {

        cleanupCall(false);


        isCalling =
            false;


        hideOutgoingCall();


        hideIncomingCall();


        isIncomingPending =
            false;


        pendingIncomingOffer =
            null;


        setInCallUI(
            false
        );


        showToast(

        );

    }
);

async function toggleFullscreen() {

    const container =
        document.getElementById(
            'screen-share-container'
        );

    const video =
        document.getElementById(
            'remote-screen'
        );


    try {

        if (
            !document.fullscreenElement
        ) {

            /*
             * Tenta colocar o container inteiro
             * em tela cheia.
             * Assim os controles continuam disponíveis.
             */

            if (
                container.requestFullscreen
            ) {

                await container.requestFullscreen();

            } else if (
                video.requestFullscreen
            ) {

                await video.requestFullscreen();

            } else if (
                video.webkitRequestFullscreen
            ) {

                video.webkitRequestFullscreen();

            }

        } else {

            if (
                document.exitFullscreen
            ) {

                await document.exitFullscreen();

            }

        }

    } catch (error) {

        console.error(
            'Erro fullscreen:',
            error
        );

    }

}

function appendMessage(data) {
